# fyi, you can call this from the setup action, so you dont need to juggle both :)
name: "Connect to Headscale"
description: "Connects to a Headscale server using the Tailscale CLI"

branding:
  icon: "server"
  color: "red"

inputs:
  headscale-cli-address:
    description: "Headscale CLI Address"
    required: true
  headscale-user:
    description: "Headscale User"
    required: true
    default: "github-actions"
  headscale-preauthkey:
    description: "Headscale Preauthkey"
    required: true
  headscale-os-arch:
    description: "Headscale OS and Architecture (see https://github.com/juanfont/headscale/releases for options). Auto-detected from the runner's architecture when omitted."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - id: resolve-arch
      shell: bash
      run: |
        case "${{ runner.arch }}" in
          X64) echo "arch=linux_amd64" >> "$GITHUB_OUTPUT" ;;
          ARM64) echo "arch=linux_arm64" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "::error::Unsupported runner.arch for headscale/tailscale: ${{ runner.arch }}"
            exit 1
            ;;
        esac

    - id: prepare-headscale-dirs
      shell: bash
      run: |
        mkdir -p $HOME/.local/bin
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # Create an empty config file (workaround for issue https://github.com/juanfont/headscale/issues/2193)
        mkdir -p $HOME/.headscale && touch $HOME/.headscale/config.yaml

    - id: resolve-headscale-version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Resolving latest headscale version..."
        if [ -n "$GH_TOKEN" ]; then
          RELEASE=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/juanfont/headscale/releases/latest)
        else
          RELEASE=$(curl -fsSL -H "Accept: application/vnd.github+json" https://api.github.com/repos/juanfont/headscale/releases/latest)
        fi
        VERSION=$(echo "$RELEASE" | jq -r '.tag_name | ltrimstr("v")')
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "::error::Could not resolve latest headscale version from GitHub releases"
          exit 1
        fi
        echo "Resolved latest headscale version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - id: cache-headscale-cli
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      with:
        path: ~/.local/bin/headscale
        key: ${{ runner.os }}-${{ runner.arch }}-headscale-cli-${{ steps.resolve-headscale-version.outputs.version }}-${{ inputs.headscale-os-arch || steps.resolve-arch.outputs.arch }}

    - id: install-headscale-cli
      if: steps.cache-headscale-cli.outputs.cache-hit != 'true'
      shell: bash
      env:
        HEADSCALE_VERSION: ${{ steps.resolve-headscale-version.outputs.version }}
        HEADSCALE_OS_ARCH: ${{ inputs.headscale-os-arch || steps.resolve-arch.outputs.arch }}
      run: |
        echo "Installing headscale cli"
        curl -L -s -o $HOME/.local/bin/headscale https://github.com/juanfont/headscale/releases/download/v${HEADSCALE_VERSION}/headscale_${HEADSCALE_VERSION}_${HEADSCALE_OS_ARCH}
        chmod +x $HOME/.local/bin/headscale

    - id: verify-headscale-version
      shell: bash
      env:
        HEADSCALE_VERSION: ${{ steps.resolve-headscale-version.outputs.version }}
      run: |
        echo "Verifying headscale version..."
        MIN_VERSION="0.27.1"
        INSTALLED_VERSION=$(headscale -c $HOME/.headscale/config.yaml version -o json 2>/dev/null | jq -r '.version // empty' | sed 's/^v//' | sed 's/+.*$//' || headscale -c $HOME/.headscale/config.yaml version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

        if [ -z "$INSTALLED_VERSION" ]; then
          echo "Error: Could not determine installed headscale version"
          exit 1
        fi

        echo "Installed version: $INSTALLED_VERSION (minimum required: $MIN_VERSION)"

        # Compare versions using sort -V (version sort)
        # If installed version is less than minimum, it will be sorted first
        SORTED_FIRST=$(printf '%s\n' "$MIN_VERSION" "$INSTALLED_VERSION" | sort -V | head -1)
        if [ "$SORTED_FIRST" = "$INSTALLED_VERSION" ] && [ "$INSTALLED_VERSION" != "$MIN_VERSION" ]; then
          echo "::error::Headscale version $INSTALLED_VERSION is below minimum required version $MIN_VERSION"
          exit 1
        fi

        echo "Version check passed: $INSTALLED_VERSION >= $MIN_VERSION"

    - id: resolve-tailscale
      shell: bash
      env:
        HEADSCALE_OS_ARCH: ${{ inputs.headscale-os-arch || steps.resolve-arch.outputs.arch }}
      run: |
        echo "Resolving latest tailscale version..."
        # tailscale-arch is everything after the OS prefix in headscale-os-arch
        # (e.g. "linux_amd64" -> "amd64"); tailscale's static tarballs are Linux-only.
        TAILSCALE_ARCH="${HEADSCALE_OS_ARCH#*_}"
        LOCATION=$(curl -fsSL -o /dev/null -w '%{url_effective}' "https://pkgs.tailscale.com/stable/tailscale_latest_${TAILSCALE_ARCH}.tgz")
        TAILSCALE_VERSION=$(basename "$LOCATION" | sed -E "s/^tailscale_([0-9.]+)_.*\.tgz\$/\1/")
        if [ -z "$TAILSCALE_VERSION" ]; then
          echo "::error::Could not resolve latest tailscale version for arch $TAILSCALE_ARCH"
          exit 1
        fi
        echo "Resolved latest tailscale version: $TAILSCALE_VERSION ($TAILSCALE_ARCH)"
        echo "arch=$TAILSCALE_ARCH" >> "$GITHUB_OUTPUT"
        echo "version=$TAILSCALE_VERSION" >> "$GITHUB_OUTPUT"

    - id: cache-tailscale-cli
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      with:
        path: |
          ~/.local/bin/tailscale
          ~/.local/bin/tailscaled
        key: ${{ runner.os }}-${{ runner.arch }}-tailscale-cli-${{ steps.resolve-tailscale.outputs.version }}-${{ steps.resolve-tailscale.outputs.arch }}

    - id: install-tailscale-cli
      if: steps.cache-tailscale-cli.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAILSCALE_VERSION: ${{ steps.resolve-tailscale.outputs.version }}
        TAILSCALE_ARCH: ${{ steps.resolve-tailscale.outputs.arch }}
      run: |
        echo "Installing Tailscale cli (static binary, no apt)"
        DIR="tailscale_${TAILSCALE_VERSION}_${TAILSCALE_ARCH}"
        curl -fsSL -o /tmp/tailscale.tgz "https://pkgs.tailscale.com/stable/${DIR}.tgz"
        tar -xzf /tmp/tailscale.tgz -C /tmp
        cp "/tmp/${DIR}/tailscale" "/tmp/${DIR}/tailscaled" $HOME/.local/bin/
        chmod +x $HOME/.local/bin/tailscale $HOME/.local/bin/tailscaled

    - id: start-tailscaled
      shell: bash
      run: |
        echo "Starting tailscaled"
        sudo mkdir -p /var/lib/tailscale /var/run/tailscale
        sudo nohup "$HOME/.local/bin/tailscaled" \
          --state=/var/lib/tailscale/tailscaled.state \
          --socket=/var/run/tailscale/tailscaled.sock \
          > /tmp/tailscaled.log 2>&1 &
        disown

        for _ in $(seq 1 30); do
          if sudo test -S /var/run/tailscale/tailscaled.sock; then
            echo "tailscaled is ready"
            exit 0
          fi
          sleep 0.5
        done

        echo "::error::tailscaled did not start in time"
        cat /tmp/tailscaled.log
        exit 1

    - id: connect-tailscale
      uses: gacts/run-and-post-run@fc6503862aba998e2f2123225ad63c09a92ed46e #v1.4.5
      with:
        run: |
          echo "Connecting to Tailscale..."
          sudo "$HOME/.local/bin/tailscale" up \
            --accept-dns \
            --accept-routes \
            --authkey=${{ inputs.headscale-preauthkey }} \
            --login-server=https://${{ inputs.headscale-cli-address }} \
            --operator=${{ inputs.headscale-user }} \
            --timeout=90s 
          echo "Tailscale status:"
          tailscale status
        post: |
          tailscale down || true
          echo "Tailscale is down!"
