name: "Setup"
description: "Setup dependencies required to run any scripts using @tahminator/pipeline"

inputs:
  GPG_PASSPHRASE:
    description: "GPG passphrase if git-crypt is required."
    required: false
  GPG_PRIVATE_KEY:
    description: "GPG private key if git-crypt is required."
    required: false
  GITHUB_TOKEN:
    description: "GitHub token used to send message"
    required: false
    default: ${{ github.token }}
  AZURE_CLIENT_ID:
    description: "Azure client ID if azure authentication is required."
    required: false
  AZURE_CLIENT_SECRET:
    description: "Azure client secret if azure authentication is required."
    required: false
  AZURE_TENANT_ID:
    description: "Azure tenant ID if azure authentication is required."
    required: false
  AZURE_SUBSCRIPTION_ID:
    description: "Azure subscription ID if azure authentication is required."
    required: false
  INSTALL_SOPS:
    description: "Would you like to install SOPS? Defaults to false"
    required: false
    default: "false"
  SOPS_VERSION:
    description: "SOPS version to install when INSTALL_SOPS is true."
    required: false
    default: "latest"
  INSTALL_PULUMI:
    description: "Would you like to install Pulumi? Defaults to false"
    required: false
    default: "false"
  PULUMI_VERSION:
    description: "Pulumi version to install when INSTALL_PULUMI is true."
    required: false
    default: "latest"
  INSTALL_JUST:
    description: "Would you like to install Just? Defaults to false"
    required: false
    default: "false"
  JUST_VERSION:
    description: "Just version to install when INSTALL_JUST is true."
    required: false
    default: "*"
  INSTALL_KUSTOMIZE:
    description: "Would you like to install kustomize? Defaults to false"
    required: false
    default: "false"
  KUSTOMIZE_VERSION:
    description: "kustomize version to install when INSTALL_KUSTOMIZE is true."
    required: false
    default: "5.8.1"
  INSTALL_KUBECONFORM:
    description: "Would you like to install kubeconform? Defaults to false"
    required: false
    default: "false"
  KUBECONFORM_VERSION:
    description: "kubeconform version to install when INSTALL_KUBECONFORM is true."
    required: false
    default: "0.8.0"
  INSTALL_KUBE_LINTER:
    description: "Would you like to install kube-linter? Defaults to false"
    required: false
    default: "false"
  KUBE_LINTER_VERSION:
    description: "kube-linter version to install when INSTALL_KUBE_LINTER is true."
    required: false
    default: "0.8.3"
  INSTALL_YAMLLINT:
    description: "Would you like to install yamllint (via pip)? Defaults to false"
    required: false
    default: "false"
  YAMLLINT_VERSION:
    description: "yamllint version to install when INSTALL_YAMLLINT is true."
    required: false
    default: "1.38.0"
  INSTALL_BREW:
    description: "Would you like to install brew? Defaults to false. INSTALL_PROTO_DEPENDENCIES or INSTALL_PROTOC also install brew."
    required: false
    default: "false"
  INSTALL_PROTOC:
    description: "Would you like to install protoc only? Defaults to false. INSTALL_PROTO_DEPENDENCIES also installs protoc."
    required: false
    default: "false"
  INSTALL_PROTO_DEPENDENCIES:
    description: "Install and cache all protobuf code-generation tools used by ProtobufCompilerClient. This installs buf, protoc, protoc-gen-go, protoc-gen-go-grpc, protoc-gen-grpc-java, protoc-gen-prost, and protoc-gen-tonic so generation stays local and does not use BSR remote plugins. Defaults to false."
    required: false
    default: "false"
  HEADSCALE_ADDRESS:
    description: "Headscale address (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  HEADSCALE_USER:
    description: "Headscale user (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  HEADSCALE_PREAUTHKEY:
    description: "Headscale preauthkey (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  SECRETS:
    description: "Pass toJSON(secrets) from the calling workflow to expose all secrets as env vars."
    required: false
    default: ""
  INSTALL_NPM:
    description: "Would you like to install npm? Defaults to false"
    required: false
    default: "false"
  NODE_VERSION:
    description: "Node.js version to install when INSTALL_NPM or INSTALL_PNPM is true."
    required: false
    default: "lts/*"
  INSTALL_PNPM:
    description: "Would you like to install pnpm? Defaults to false"
    required: false
    default: "false"
  PNPM_VERSION:
    description: "pnpm version to install when INSTALL_PNPM is true."
    required: false
    default: "latest"
  PNPM_CACHE:
    description: "Cache the pnpm store when INSTALL_PNPM is true."
    required: false
    default: "false"
  PNPM_CACHE_DEPENDENCY_PATH:
    description: "Lockfile paths used for the pnpm cache key, separated by newlines."
    required: false
    default: "pnpm-lock.yaml"
  PNPM_PACKAGE_JSON_FILE:
    description: "Repository-relative package.json path used by pnpm to read packageManager configuration."
    required: false
    default: "package.json"
  CARGO_PACKAGES:
    description: "Cargo packages to install, separated by spaces or newlines. Supports crate@version syntax."
    required: false
    default: ""
  BUN_VERSION:
    description: "Bun version to install."
    required: false
    default: "latest"
  LINT_CI:
    description: "Typecheck, lint, and check formatting using the CI package's TypeScript, Oxlint, and Oxfmt dependencies."
    required: false
    default: "false"
  GITHUB_SCRIPTS_DIR:
    description: "Where are your Bun scripts located?"
    required: false
    default: "./.github/scripts"
  INSTALL_GO:
    description: "Would you like to install Go (with module and build caching)? Defaults to false"
    required: false
    default: "false"
  GO_VERSION:
    description: "Go version to install when INSTALL_GO is true. Takes precedence over GO_VERSION_FILE."
    required: false
    default: ""
  GO_VERSION_FILE:
    description: "File to read the Go version from when INSTALL_GO is true and GO_VERSION is empty."
    required: false
    default: "go.mod"
  INSTALL_JAVA:
    description: "Would you like to install Java? Defaults to false"
    required: false
    default: "false"
  JAVA_VERSION:
    description: "Java version to install when INSTALL_JAVA is true."
    required: false
    default: "21"
  JAVA_DISTRIBUTION:
    description: "Java distribution to install when INSTALL_JAVA is true."
    required: false
    default: "temurin"
  JAVA_CACHE:
    description: "Build tool dependencies to cache when INSTALL_JAVA is true (maven, gradle or sbt). Empty disables built-in caching. JAVA_CACHE_KEY overrides built-in caching."
    required: false
    default: "maven"
  JAVA_CACHE_DEPENDENCY_PATH:
    description: "Dependency file paths or globs used for the built-in Java cache key, separated by newlines. Empty uses setup-java defaults. Ignored when JAVA_CACHE_KEY is set."
    required: false
    default: ""
  JAVA_CACHE_PATH:
    description: "Optional Java dependency cache paths or globs, separated by newlines. Omit both JAVA_CACHE_PATH and JAVA_CACHE_KEY to use setup-java's automatic caching. An explicit path is needed only when supplying a custom JAVA_CACHE_KEY."
    required: false
    default: ""
  JAVA_CACHE_KEY:
    description: "Optional custom Java dependency cache key. Omit to let setup-java generate the key automatically. Setting this switches to actions/cache and needs an explicit JAVA_CACHE_PATH."
    required: false
    default: ""
  JAVA_CACHE_RESTORE_KEYS:
    description: "Optional fallback cache key prefixes, separated by newlines, for a custom JAVA_CACHE_KEY. Omit for exact-key matching only."
    required: false
    default: ""
  INSTALL_RUST:
    description: "Would you like to install Rust (with Cargo registry and target caching)? Defaults to false. Installs before CARGO_PACKAGES and INSTALL_PROTO_DEPENDENCIES, which use cargo."
    required: false
    default: "false"
  RUST_TOOLCHAIN:
    description: "Rust toolchain to install when INSTALL_RUST is true."
    required: false
    default: "stable"
  RUST_COMPONENTS:
    description: "Comma-separated rustup components to install when INSTALL_RUST is true, e.g. clippy, rustfmt."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Export GitHub Token
      shell: bash
      run: echo "GH_TOKEN=${{ inputs.GITHUB_TOKEN }}" >> $GITHUB_ENV

    - name: Export runner debug variable if exists
      shell: bash
      run: |
        echo "DEBUG=${{ runner.debug == '1' && 'true' || 'false' }}" >> $GITHUB_ENV

    - name: Expose GitHub Runtime
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 #v4

    - name: Disable man-db
      shell: bash
      run: sudo bash -ec 'echo "set man-db/auto-update false" | debconf-communicate; dpkg-reconfigure man-db'

    - name: Set up Homebrew
      if: inputs.INSTALL_BREW == 'true' || inputs.INSTALL_PROTO_DEPENDENCIES == 'true' || inputs.INSTALL_PROTOC == 'true'
      shell: bash
      run: |
        set -euo pipefail
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
        echo "$HOMEBREW_PREFIX/sbin" >> "$GITHUB_PATH"
        echo "HOMEBREW_NO_AUTO_UPDATE=1" >> "$GITHUB_ENV"
        echo "HOMEBREW_NO_INSTALL_FROM_API=" >> "$GITHUB_ENV"

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 #v2.2.0
      with:
        bun-version: ${{ inputs.BUN_VERSION }}

    - name: Setup Node.js
      if: inputs.INSTALL_NPM == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        package-manager-cache: false

    - name: Setup pnpm
      if: inputs.INSTALL_PNPM == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
      with:
        version: ${{ inputs.PNPM_VERSION }}
        run_install: false
        cache: ${{ inputs.PNPM_CACHE }}
        cache_dependency_path: ${{ inputs.PNPM_CACHE_DEPENDENCY_PATH }}
        package_json_file: ${{ inputs.PNPM_PACKAGE_JSON_FILE }}

    - name: Cache Bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles(format('{0}/bun.lock', inputs.GITHUB_SCRIPTS_DIR)) }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install deps
      shell: bash
      run: bun install --cwd "${{ inputs.GITHUB_SCRIPTS_DIR }}" --frozen-lockfile

    - name: Setup Go
      if: inputs.INSTALL_GO == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
      with:
        go-version: ${{ inputs.GO_VERSION }}
        go-version-file: ${{ inputs.GO_VERSION == '' && inputs.GO_VERSION_FILE || '' }}

    - name: Setup Java
      if: inputs.INSTALL_JAVA == 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 #v6.0.1
      with:
        distribution: ${{ inputs.JAVA_DISTRIBUTION }}
        java-version: ${{ inputs.JAVA_VERSION }}
        cache: ${{ inputs.JAVA_CACHE_KEY == '' && inputs.JAVA_CACHE || '' }}
        cache-dependency-path: ${{ inputs.JAVA_CACHE_DEPENDENCY_PATH }}
        cache-path: ${{ inputs.JAVA_CACHE_PATH }}

    - name: Cache Java dependencies
      if: inputs.INSTALL_JAVA == 'true' && inputs.JAVA_CACHE_KEY != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.JAVA_CACHE_PATH }}
        key: ${{ inputs.JAVA_CACHE_KEY }}
        restore-keys: ${{ inputs.JAVA_CACHE_RESTORE_KEYS }}

    - name: Setup Rust
      if: inputs.INSTALL_RUST == 'true'
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 #master
      with:
        toolchain: ${{ inputs.RUST_TOOLCHAIN }}
        components: ${{ inputs.RUST_COMPONENTS }}

    - name: Cache Rust dependencies
      if: inputs.INSTALL_RUST == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 #v2.9.2

    - name: Load GPG secret key
      uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd #v7.0.0
      if: inputs.GPG_PRIVATE_KEY != '' && inputs.GPG_PASSPHRASE != ''
      with:
        gpg_private_key: ${{ inputs.GPG_PRIVATE_KEY }}
        passphrase: ${{ inputs.GPG_PASSPHRASE }}

    - name: Install git-crypt
      if: inputs.GPG_PRIVATE_KEY != '' && inputs.GPG_PASSPHRASE != ''
      uses: flydiverny/setup-git-crypt@2619b678cbfab55aeb588cd5d8b1f0bbdfebe6d8 #v5

    - name: Authenticate to Azure
      if: inputs.AZURE_CLIENT_ID != '' && inputs.AZURE_CLIENT_SECRET != '' && inputs.AZURE_TENANT_ID != '' && inputs.AZURE_SUBSCRIPTION_ID != ''
      uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 #v3.1.0
      with:
        creds: '{"clientId":"${{ inputs.AZURE_CLIENT_ID }}","clientSecret":"${{ inputs.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ inputs.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ inputs.AZURE_TENANT_ID }}"}'

    - name: Setup SOPS
      uses: nhedger/setup-sops@18e52f363488ed469d2e1855e542a1c651743bba #v3
      if: inputs.INSTALL_SOPS == 'true'
      with:
        version: ${{ inputs.SOPS_VERSION }}

    - name: Setup Pulumi CLI
      uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d #v7
      if: inputs.INSTALL_PULUMI == 'true'
      with:
        pulumi-version: ${{ inputs.PULUMI_VERSION }}

    - name: Setup Just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0
      if: inputs.INSTALL_JUST == 'true'
      with:
        just-version: ${{ inputs.JUST_VERSION }}

    - name: Install kustomize
      if: inputs.INSTALL_KUSTOMIZE == 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${{ inputs.KUSTOMIZE_VERSION }}/kustomize_v${{ inputs.KUSTOMIZE_VERSION }}_linux_amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin kustomize

    - name: Install kubeconform
      if: inputs.INSTALL_KUBECONFORM == 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -sL "https://github.com/yannh/kubeconform/releases/download/v${{ inputs.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin kubeconform

    - name: Install kube-linter
      if: inputs.INSTALL_KUBE_LINTER == 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -sL -o /tmp/kube-linter "https://github.com/stackrox/kube-linter/releases/download/v${{ inputs.KUBE_LINTER_VERSION }}/kube-linter-linux"
        sudo install -m 0755 /tmp/kube-linter /usr/local/bin/kube-linter

    - name: Install yamllint
      if: inputs.INSTALL_YAMLLINT == 'true'
      shell: bash
      run: pip install --user "yamllint==${{ inputs.YAMLLINT_VERSION }}"

    - name: Add protobuf tool paths
      if: inputs.INSTALL_PROTO_DEPENDENCIES == 'true'
      shell: bash
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache protobuf toolchains
      if: inputs.INSTALL_PROTO_DEPENDENCIES == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/protoc-gen-prost
          ~/.cargo/bin/protoc-gen-tonic
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-${{ runner.arch }}-protobuf-tools-v3

    - name: Install Protoc
      if: inputs.INSTALL_PROTOC == 'true' || inputs.INSTALL_PROTO_DEPENDENCIES == 'true'
      shell: bash
      run: |
        set -euo pipefail
        brew install protobuf

    - name: Install protobuf dependencies
      if: inputs.INSTALL_PROTO_DEPENDENCIES == 'true'
      shell: bash
      run: |
        set -euo pipefail

        brew install buf protoc-gen-go protoc-gen-go-grpc protoc-gen-grpc-java

        if ! command -v protoc-gen-prost; then
          cargo install protoc-gen-prost
        fi

        if ! command -v protoc-gen-tonic; then
          cargo install protoc-gen-tonic
        fi

    - name: Setup Headscale
      uses: $/actions/headscale-connect-action
      if: inputs.HEADSCALE_ADDRESS != '' || inputs.HEADSCALE_USER != '' || inputs.HEADSCALE_PREAUTHKEY != ''
      with:
        headscale-user: ${{ inputs.HEADSCALE_USER }}
        headscale-preauthkey: ${{ inputs.HEADSCALE_PREAUTHKEY }}
        headscale-cli-address: ${{ inputs.HEADSCALE_ADDRESS }}

    - name: Expose GitHub secrets to environment
      if: inputs.SECRETS != ''
      shell: bash
      env:
        SECRETS: ${{ inputs.SECRETS }}
      run: bun run "${{ github.action_path }}/../../src/internal/expose-secrets"

    - name: Lint CI scripts
      if: inputs.LINT_CI == 'true'
      shell: bash
      working-directory: ${{ inputs.GITHUB_SCRIPTS_DIR }}
      run: |
        bun run "${{ github.action_path }}/../../src/internal/tsc.ts"
        bun run "${{ github.action_path }}/../../src/internal/lintfmt.ts"

    - name: Install Cargo packages
      if: inputs.CARGO_PACKAGES != ''
      uses: baptiste0928/cargo-install@v3
      with:
        crate: ${{ inputs.CARGO_PACKAGES }}
